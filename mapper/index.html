<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tools - Mapper</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="../split.css">
<style>
    textarea#input {
        margin-top: 15px;
    }

    textarea#mapper {
        width: 90%;
        height: 25%;
    }

    textarea#output {
        width: 90%;
        height: 60%;
    }

    h3 {
        display: inline;
    }

    #filterDiv {
        margin-top: 15px;
    }

    #filter {
        width: 80%;
    }
</style>
</head>
<body>

    <div class="split left">
        <div class="centered">
            <h2>Input</h2>
            <h3>Paste or </h3>
            <input id="file" type="file" onchange="onUpload(this)" />
            <br/>
            <textarea id="input" oninput="generateOutput()"></textarea>
        </div>
    </div>
    <div class="split right">
        <div class="centered">
            <h2>Mapping Func</h2>
            <textarea id="mapper" oninput="generateOutput()"></textarea>
            <div id="filterDiv">
            <h3>Filter</h3>
            <input id="filter" type="text" oninput="generateOutput()" />
            </div>
            <h2>Output</h2>
            <textarea id="output"></textarea>
        </div>
    </div>
    <script>
    
    const inputDom = document.getElementById("input")
    const mapperDom = document.getElementById("mapper")
    const outputDom = document.getElementById("output")
    const filterDom = document.getElementById("filter")

    function onUpload(file) {
        var fr = new FileReader()
        fr.onload = function(e) {
            inputDom.value = e.target.result
            generateOutput()
        }
        fr.readAsText(file.files[0])
    }

    function mappedInput() {
        const input = inputDom.value
        const inputObj = JSON.parse(input)
        if (mapperDom.value.length == 0) {
            return inputObj
        }
        eval("var fn = " + mapperDom.value)

        if (Array.isArray(inputObj)) {
            return inputObj.map(fn)
        }
        return fn(inputObj)
    }

    function isObject(val) {
        return val !== null && typeof val === "object" && !Array.isArray(val)
    }

    // pick a dotted path like "a.b.c" out of val, mapping over any arrays along the way.
    // returns [found, picked]
    function pickPath(val, keys) {
        if (keys.length == 0) {
            return [true, val]
        }
        if (Array.isArray(val)) {
            // keep indices aligned so later filters can merge element by element
            return [true, val.map(innerVal => {
                const [found, picked] = pickPath(innerVal, keys)
                return found ? picked : {}
            })]
        }
        if (!isObject(val) || val[keys[0]] === undefined) {
            return [false, undefined]
        }
        const [found, picked] = pickPath(val[keys[0]], keys.slice(1))
        return found ? [true, { [keys[0]]: picked }] : [false, undefined]
    }

    // combine results from multiple filters on the same key, e.g. "user.name, user.id"
    function mergeFiltered(existing, picked) {
        if (existing === undefined) {
            return picked
        }
        if (Array.isArray(existing) && Array.isArray(picked)) {
            return existing.map((innerObj, i) => mergeFiltered(innerObj, picked[i]))
        }
        if (isObject(existing) && isObject(picked)) {
            const out = { ...existing }
            for (const key of Object.keys(picked)) {
                out[key] = mergeFiltered(existing[key], picked[key])
            }
            return out
        }
        return picked
    }

    function filterObject(input, allFilters) {
        let out = undefined
        for (const filter of allFilters) {
            const [found, picked] = pickPath(input, filter.split("."))
            if (found) {
                out = mergeFiltered(out, picked)
            }
        }
        return out === undefined ? {} : out
    }

    function filteredInput() {
        const input = mappedInput()
        if (filterDom.value.length == 0) {
            return input
        }
        const allFilters = filterDom.value.split(",").map(filter => filter.trim()).filter(filter => filter.length > 0)

        if (Array.isArray(input)) {
            return input.map(element => filterObject(element, allFilters))
        } else {
            return filterObject(input, allFilters)
        }
    }

    function generateOutput() {
        outputDom.value = JSON.stringify(filteredInput(), null, 2)
    }
    
    </script>

</body>
</html>
